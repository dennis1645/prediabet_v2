# ==============================================================================
# PrediaBeat AI Stack (Server AI + vLLM GPU + Neo4j Graph Database)
# 1. server_ai : Hybrid GraphRAG + FastAPI + Allergen Guardrail (Port 8002)
# 2. vllm      : Qwen 2.5 Inference Engine via NVIDIA GPU (Port 8000)
# 3. neo4j     : Medical Knowledge Graph Database (Port 7687 & 7474)
# Network : prediabeat-network (Docker Bridge, shared with Application Stack)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # SERVICE 1: Server AI (FastAPI + Hybrid GraphRAG + Allergen Guardrail)
  # ----------------------------------------------------------------------------
  server_ai:
    build:
      context: ./server_ai
      dockerfile: Dockerfile
    image: prediabeat-server-ai:latest
    container_name: prediabeat-server-ai
    restart: unless-stopped
    init: true
    security_opt:
      - apparmor:unconfined
    ports:
      - "8002:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MODEL_ID=Qwen/Qwen2.5-7B-Instruct-GPTQ-Int8
      - VLLM_API_BASE=http://vllm:8000/v1
      - EXPRESS_BACKEND_URL=http://prediabeat-web:5000/api
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=prediabeat2026
    volumes:
      - ./server_ai/app:/app/app
      - ./server_ai/knowledge_base_new:/app/knowledge_base_new
      - ./logs:/app/logs
    networks:
      prediabeat-network:
        aliases:
          - prediabeat-server-ai
          - server-ai
          - server_ai
    depends_on:
      - vllm
      - neo4j

  # ----------------------------------------------------------------------------
  # SERVICE 2: vLLM Inference Engine (GPU RTX 5070 Ti)
  # ----------------------------------------------------------------------------
  vllm:
    image: vllm/vllm-openai:latest
    container_name: prediabeat-vllm
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    runtime: nvidia
    ipc: host
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      Qwen/Qwen2.5-7B-Instruct-GPTQ-Int8
      --port 8000
      --gpu-memory-utilization 0.85
      --max-model-len 4096
      --dtype auto
      --trust-remote-code
    networks:
      prediabeat-network:
        aliases:
          - vllm
          - prediabeat-vllm

  # ----------------------------------------------------------------------------
  # SERVICE 3: Neo4j Medical Knowledge Graph Database
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.18.0
    container_name: prediabeat-neo4j
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/prediabeat2026
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - prediabeat-neo4j-data:/data
      - prediabeat-neo4j-logs:/logs
      - ./server_ai/knowledge_base_new/neo4j:/var/lib/neo4j/import
    networks:
      prediabeat-network:
        aliases:
          - neo4j
          - prediabeat-neo4j

# ------------------------------------------------------------------------------
# Shared Bridge Network (Connects to App Stack)
# ------------------------------------------------------------------------------
networks:
  prediabeat-network:
    name: prediabeat-network
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  server-ai-knowledge:
    name: server-ai-knowledge
  prediabeat-neo4j-data:
    name: prediabeat-neo4j-data
  prediabeat-neo4j-logs:
    name: prediabeat-neo4j-logs
