# ==============================================================================
# PrediaBeat Multi-Container Architecture (Docker Compose - All-in-One)
# 1. prediabeat-web : Combined React Frontend + Express Backend (Port 8080 & 5000)
# 2. server_ai      : Hybrid GraphRAG + FastAPI + Allergen Guardrail (Port 8002)
# 3. vllm           : Qwen 2.5 Inference Engine via NVIDIA GPU (Port 8000)
# 4. neo4j          : Medical Knowledge Graph Database (Port 7687 & 7474)
# Network           : prediabeat-network (Docker Bridge)
# ==============================================================================

version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # SERVICE 1: Frontend + Backend (Combined Single Image)
  # ----------------------------------------------------------------------------
  prediabeat-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: prediabeat-web:latest
    container_name: prediabeat-web
    restart: unless-stopped
    ports:
      - "8080:5000"
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=prediabeat_super_secure_jwt_token_key_2026!
      - JWT_EXPIRES_IN=7d
      - DATABASE_FILE=./data/prediabeat.db
      - CLIENT_ORIGIN=http://localhost:5000
      - AI_SERVER_URL=http://server_ai:8000/api/chat
    volumes:
      - prediabeat-db-data:/app/backend/data
    networks:
      - prediabeat-network
    depends_on:
      - server_ai

  # ----------------------------------------------------------------------------
  # SERVICE 2: Server AI (FastAPI + Hybrid GraphRAG + Allergen Guardrail)
  # ----------------------------------------------------------------------------
  server_ai:
    build:
      context: ./server_ai
      dockerfile: Dockerfile
    image: prediabeat-server-ai:latest
    container_name: prediabeat-server-ai
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MODEL_ID=Qwen/Qwen2.5-7B-Instruct-GPTQ-Int8
      - VLLM_API_BASE=http://vllm:8000/v1
      - EXPRESS_BACKEND_URL=http://prediabeat-web:5000/api
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=prediabeat2026
    volumes:
      - server-ai-knowledge:/app/knowledge_base
      - ./logs:/app/logs
    networks:
      - prediabeat-network
    depends_on:
      - vllm
      - neo4j

  # ----------------------------------------------------------------------------
  # SERVICE 3: vLLM Inference Engine (GPU RTX 5070 Ti)
  # ----------------------------------------------------------------------------
  vllm:
    image: vllm/vllm-openai:latest
    container_name: prediabeat-vllm
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen2.5-7B-Instruct-GPTQ-Int8
      --port 8000
      --gpu-memory-utilization 0.85
      --max-model-len 4096
      --dtype auto
      --trust-remote-code
    networks:
      - prediabeat-network

  # ----------------------------------------------------------------------------
  # SERVICE 4: Neo4j Medical Knowledge Graph Database
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.18.0
    container_name: prediabeat-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/prediabeat2026
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - prediabeat-neo4j-data:/data
      - prediabeat-neo4j-logs:/logs
      - ./server_ai/knowledge_base/neo4j:/var/lib/neo4j/import
    networks:
      - prediabeat-network

# ------------------------------------------------------------------------------
# Isolated Bridge Network for Safe Inter-Service Communication
# ------------------------------------------------------------------------------
networks:
  prediabeat-network:
    name: prediabeat-network
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  prediabeat-db-data:
    name: prediabeat-db-data
  server-ai-knowledge:
    name: server-ai-knowledge
  prediabeat-neo4j-data:
    name: prediabeat-neo4j-data
  prediabeat-neo4j-logs:
    name: prediabeat-neo4j-logs
